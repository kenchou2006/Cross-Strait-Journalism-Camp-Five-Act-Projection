<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們與流量的距離｜五幕投影</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000}
  body{display:grid;place-items:center;overflow:hidden}
  main{width:min(100vw,177.777vh);height:min(100vh,56.25vw);aspect-ratio:16/9;position:relative;background:#071317}
  img{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  img.active{display:block}
</style>
</head>
<body>
<main aria-label="我們與流量的距離五幕投影">
  <img class="active" src="scene-01.png" alt="第一幕：人物與核心問題">
  <img src="scene-02.png" alt="第二幕：新聞標題">
  <img src="scene-03.png" alt="第三幕：流量與自律">
  <img src="scene-04.png" alt="第四幕：被報導的人">
  <img src="scene-05.png" alt="第五幕：媒觀與轉發前的問題">
</main>
<script>
  const pages=[...document.querySelectorAll('main img')];let n=0;
  function show(i){n=Math.max(0,Math.min(pages.length-1,i));pages.forEach((p,j)=>p.classList.toggle('active',j===n));}
  document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(n+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(n-1)}else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}});
  document.querySelector('main').addEventListener('click',()=>show(n+1));
</script>
</body>
</html>
